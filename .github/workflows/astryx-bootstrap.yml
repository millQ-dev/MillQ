name: Astryx bootstrap

on:
  push:
    branches: ['chore/astryx-init']

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install existing workspace
        run: pnpm install --frozen-lockfile
      - name: Install Astryx runtime packages in web app
        run: pnpm --filter @millq/web add @astryxdesign/core @stylexjs/stylex @astryxdesign/theme-neutral
      - name: Install Astryx CLI at workspace root
        run: pnpm add -Dw @astryxdesign/cli
      - name: Initialize Astryx agent docs
        run: npx @astryxdesign/cli init
      - name: Commit generated setup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(design): initialize Astryx design system"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
